<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaRecall</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>PharmaRecall</h1>
        <p>Interactive Pharmacology Study</p>
    </header>

    <main>
        <section class="deck-header">
            <h2>Pain &amp; Migraine</h2>
            <p id="card-counter">Drug 1 of 14</p>
        </section>

<section class="flashcard-container">
    <article class="flashcard" id="flashcard">

        <div class="card-face card-front">

            <p class="card-label">DRUG</p>
            <h2 id="drug-name">Acetaminophen</h2>
            <p id="brand-name">Tylenol</p>

        </div>

        <div class="card-face card-back">

            <section>
                <h3>Notable Side Effects</h3>
                <p id="side-effects"></p>
            </section>

            <section>
                <h3>Clinical Pharmacology</h3>
                <p id="clinical-pharmacology"></p>
            </section>

            <section>
                <h3>Food–Drug Interactions</h3>
                <p id="food-interactions"></p>
            </section>

        </div>

    </article>
</section>

<section id="practice-panel" class="practice-panel">

    <p class="practice-label">EASY PRACTICE</p>
            <div class="practice-score">
                <span>Questions: <strong id="session-attempts">0</strong></span>
                <span>
                    Score:
                    <strong id="session-score">0</strong>
                </span>
            </div>

    <h2>What are the notable side effects?</h2>

    <p id="practice-drug-name"></p>

    <input
        type="text"
        id="practice-answer"
        placeholder="Type your answer..."
        autocomplete="off"
    >

    <div class="practice-actions">
        <button id="check-answer-btn">Check Answer</button>
        <button id="reveal-answer-btn">Reveal Answer</button>
    </div>

    <p id="practice-feedback"></p>
    <div id="practice-navigation" class="practice-navigation">
        <button id="try-again-btn">Try Again</button>
        <button id="next-question-btn">Next Question →</button>
    </div>

</section>
        
        <nav class="card-controls" id="card-controls">
            <button id="previous-btn">← Previous</button>
            <button id="flip-btn">Flip Card</button>
            <button id="next-btn">Next →</button>
        </nav>

        <section class="study-controls">
            <button id="study-mode-btn" class="active">Study Mode</button>
            <button id="practice-mode-btn">Practice Mode</button>
        </section>

    </main>

    <footer>
        <p>PharmaRecall — Pharmacology Study Tool</p>
    </footer>

    <script src="data/drugs.js"></script>
    <script src="app.js"></script>

</body>
</html>
